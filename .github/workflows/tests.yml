name: SSE Analytics Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.py"
      - "requirements.txt"
      - ".github/workflows/tests.yml"
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "requirements.txt"
      - ".github/workflows/tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compile and run analytics tests
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -v
