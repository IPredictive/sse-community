name: Daily SSE Agents

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "*.py"
      - "requirements.txt"
      - "site/community.js"
      - ".github/workflows/daily.yml"
  schedule:
    - cron: "35 7 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages-deployment
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Validate Python and analytics tests
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -v

      - name: Sync latest main before generation
        run: git pull --rebase origin main

      - name: Run agents
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AGNES_API_URL: ${{ vars.AGNES_API_URL }}
          AGNES_MODEL: ${{ vars.AGNES_MODEL }}
        run: python run_daily.py

      - name: Generate dashboard
        run: python generate_site.py

      - name: Commit state and dashboard
        run: |
          git config user.name "sse-agents[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sse.db data/learning_state.json data/postmortem_state.json data/event_memory.json data/similarity_memory.json data/calibration_state.json data/scenario_state.json data/routing_state.json data/brain_scorecard.json data/brain_performance_history.json site/brain-scorecard.json site/brain-performance-history.json site/index.html
          git diff --cached --quiet || git commit -m "data: daily SSE prediction and brain scorecard"

          # Preserve every learned state file across non-fast-forward retries.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push attempt $attempt failed; syncing latest main and retrying."
            cp data/sse.db /tmp/sse.db
            cp data/learning_state.json /tmp/learning_state.json
            cp data/postmortem_state.json /tmp/postmortem_state.json
            cp data/event_memory.json /tmp/event_memory.json
            cp data/similarity_memory.json /tmp/similarity_memory.json
            cp data/calibration_state.json /tmp/calibration_state.json
            cp data/scenario_state.json /tmp/scenario_state.json
            cp data/routing_state.json /tmp/routing_state.json
            cp data/brain_scorecard.json /tmp/brain_scorecard.json
            cp data/brain_performance_history.json /tmp/brain_performance_history.json
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/sse.db data/sse.db
            cp /tmp/learning_state.json data/learning_state.json
            cp /tmp/postmortem_state.json data/postmortem_state.json
            cp /tmp/event_memory.json data/event_memory.json
            cp /tmp/similarity_memory.json data/similarity_memory.json
            cp /tmp/calibration_state.json data/calibration_state.json
            cp /tmp/scenario_state.json data/scenario_state.json
            cp /tmp/routing_state.json data/routing_state.json
            cp /tmp/brain_scorecard.json data/brain_scorecard.json
            cp /tmp/brain_performance_history.json data/brain_performance_history.json
            python -c "from brains.scorecard import persist_scorecard; persist_scorecard()"
            python generate_site.py
            git add data/sse.db data/learning_state.json data/postmortem_state.json data/event_memory.json data/similarity_memory.json data/calibration_state.json data/scenario_state.json data/routing_state.json data/brain_scorecard.json data/brain_performance_history.json site/brain-scorecard.json site/brain-performance-history.json site/index.html
            git diff --cached --quiet || git commit -m "data: daily SSE prediction and brain scorecard"
            sleep 2
          done
          echo "::error::Unable to publish daily prediction after 3 attempts."
          exit 1

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - uses: actions/upload-artifact@v4
        with:
          name: sse-state-${{ github.run_number }}
          path: |
            data/sse.db
            data/brain_scorecard.json
            data/brain_performance_history.json
            data/calibration_state.json
            data/routing_state.json
          retention-days: 30
