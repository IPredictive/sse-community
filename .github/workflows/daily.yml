name: Daily SSE Agents

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "*.py"
      - "requirements.txt"
      - "site/community.js"
      - ".github/workflows/daily.yml"
  schedule:
    - cron: "35 7 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-sse-agents
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run agents
        run: python run_daily.py

      - name: Generate dashboard
        run: python generate_site.py

      - name: Commit state and dashboard
        run: |
          git config user.name "sse-agents[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sse.db site/index.html
          git diff --cached --quiet || git commit -m "data: daily SSE prediction"
          git pull --rebase origin main
          git push

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - uses: actions/upload-artifact@v4
        with:
          name: sse-state-${{ github.run_number }}
          path: data/sse.db
          retention-days: 30
