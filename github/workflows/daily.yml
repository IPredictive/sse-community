name: Daily SSE Agents
on:
  workflow_dispatch:
  schedule:
    - cron: "35 15 * * 1-5"
      timezone: "Asia/Shanghai"
permissions:
  contents: write
concurrency:
  group: daily-sse-agents
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run agents
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: python run_daily.py
      - run: python generate_site.py
      - name: Commit state
        run: |
          git config user.name "sse-agents[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sse.db site/index.html
          git diff --cached --quiet || git commit -m "data: daily SSE prediction"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: sse-state-${{ github.run_number }}
          path: data/sse.db
          retention-days: 30
